aid: resynergi
name: Resynergi
description: >-
  Resynergi is an advanced plastic recycling technology company that builds modular
  Continuous Microwave Assisted Pyrolysis (CMAP) systems, marketed as AMP Modules, which
  convert hard-to-recycle waste plastics (HDPE, LDPE, polypropylene and polystyrene) into
  circular pyrolysis oil (PyOil) and other petrochemical feedstocks. Each 440 sq ft module
  is designed to process roughly 5 tons of plastic waste per day and produce about 1,000
  gallons of PyOil per day, and the company claims a conversion roughly twenty times faster
  than conventional pyrolysis with a large reduction in CO2-equivalent emissions. Founded in
  2015 by Jason Tanne and Brian Bauer around microwave pyrolysis research from the University
  of Minnesota, Resynergi commercializes its modules in partnership with Lummus Technology,
  which sells the AMP Modules, and also operates plants near the source of waste under a
  partner model. This is an industrial process-equipment business; it is not a software
  vendor and publishes no developer program, API, SDK or machine-readable API contract.
