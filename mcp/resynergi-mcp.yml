status: platform-default
name: WordPress MCP adapter on resynergi.com
description: >-
  Resynergi publishes no MCP server of its own. Its marketing site runs on WordPress.com
  (the /wp-json/ index exposes the wpcomsh/v1, jetpack/v4, elementor/v1 and wp-abilities/v1
  namespaces), and that platform ships an MCP adapter which is live at
  https://resynergi.com/wp-json/mcp/mcp-oauth-server. The endpoint answers a JSON-RPC
  tools/list with HTTP 401 {"code":"mcp_unauthorized"}, and RFC 9728 protected-resource
  metadata names it as the protected resource with scope "mcp". The abilities behind it are
  WordPress content-management abilities (wp-abilities/v1, also 401 anonymously) — posts,
  pages, media, site settings — not Resynergi's plastics-pyrolysis business.

