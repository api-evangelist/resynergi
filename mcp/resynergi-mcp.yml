  metadata: /.well-known/oauth-authorization-server
  protected_resource_metadata: /.well-known/oauth-protected-resource
  grant_types: [authorization_code, refresh_token]
  code_challenge_methods: [S256]
  scopes: [mcp]
  dynamic_client_registration: client_id_metadata_document_supported

tools: []
tools_note: >-
  Not enumerable. tools/list is OAuth-gated (401) on both servers, and the WordPress
  Abilities API index (/wp-json/wp-abilities/v1/abilities) is likewise 401 anonymously.
  Nothing is derived or guessed here; an authenticated WordPress session would be required
  to read the real tool schemas.

